<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asoftcon Relatórios</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">

            <a href="index.html">
                ASOFTCON
            </a>

        </div>


        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="#reports">
                Relatórios
            </a>

            <a href="support.html">
                Suporte
            </a>

        </nav>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Biblioteca de Relatórios
        </h1>

        <p>
            Procure, visualize e baixe relatórios e layouts para sua empresa.
        </p>

    </section>


    <!-- REPORTS -->

    <main
        class="container"
        id="reports"
    >

        <h2 class="section-title">
            Busca de Relatórios
        </h2>


        <!-- SEARCH -->

        <div class="search-container">

            <input
                type="text"
                id="search-input"
                placeholder="O que está procurando?"
            >

        </div>


        <!-- CATEGORY FILTERS -->

        <div
            class="category-filters"
            id="category-filters"
        >
        </div>


        <!-- REPORT CARDS -->

        <div
            class="report-grid"
            id="report-grid"
        >
        </div>


        <!-- NO RESULTS -->

        <div
            class="no-results"
            id="no-results"
        >
            Nenhum relatório encontrado.
        </div>


    </main>


    <!-- JAVASCRIPT -->

    <script src="reports.js"></script>

    <script src="script.js"></script>


</body>

</html>
