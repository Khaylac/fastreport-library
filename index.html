<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FastReport Library</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            FastReport Library
        </div>


        <nav>

            <a href="#">
                Home
            </a>

            <a href="#">
                Reports
            </a>

            <a href="#">
                About
            </a>

        </nav>

    </header>


    <!-- HERO SECTION -->

    <section class="hero">

        <h1>
            FastReport Report Library
        </h1>

        <p>
            A collection of reusable reports and templates.
        </p>

    </section>


    <!-- REPORTS -->

    <main class="container">

        <h2 class="section-title">
            Featured Reports
        </h2>


        <!--
            Report cards are generated automatically
            by script.js using the data from reports.js
        -->

        <div
            class="report-grid"
            id="report-grid"
        >
        </div>


    </main>


    <!-- JAVASCRIPT -->

    <script src="reports.js"></script>

    <script src="script.js"></script>


</body>

</html>
